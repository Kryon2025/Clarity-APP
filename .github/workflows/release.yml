name: Build and publish pre-release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK and publish pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare release metadata
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          TAG="v$VERSION-build.$GITHUB_RUN_NUMBER"
          APK="shenqing-mobile-$VERSION-build.$GITHUB_RUN_NUMBER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "深清手机端 ${{ steps.meta.outputs.version }} · 测试版 #${{ github.run_number }}"
          body: |
            自动构建的测试版 APK（debug 签名），每次 main 分支更新自动发布。

            - 版本：${{ steps.meta.outputs.version }}
            - 提交：${{ github.sha }}
            - 类型：Pre-release（不是正式版）
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
